<style>/* ── Pousada Jardim Monte Verde — Página de Obrigado — Réveillon 2026/2027 ── */
/* Cole no campo CSS da Edição Avançada do RD Station */
@import url('https://fonts.googleapis.com/css2?family=Raleway:wght@0,400;0,600;0,700&family=Montserrat:wght@600;700&display=swap');

@font-face {
  font-family: 'Bethia';
  src: url('https://giuiia.github.io/LP-jardim-EarlyBooking/bethia/Bethia.otf') format('opentype'),
       url('https://giuiia.github.io/LP-jardim-EarlyBooking/bethia/Bethia.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

/* Ocultar conteúdo padrão do RD Station (sem esconder os wrappers da página) */
body > *:not(:has(#jmv-obrigado)):not(script):not(style):not(link) {
  display: none !important;
}

/* Neutralizar larguras/margens dos wrappers do RD e pintar o fundo verde */
html, body { margin: 0 !important; padding: 0 !important; background: #0C2C28 !important; }
.bricks--container, .bricks--page, .bricks--section, .bricks--row, .bricks--column,
.rd-section, .rd-row, .rd-column {
  max-width: 100% !important;
  width: 100% !important;
  padding: 0 !important;
  margin: 0 !important;
  float: none !important;
  background: transparent !important;
}

/* Reset local */
#jmv-obrigado, #jmv-obrigado *, #jmv-obrigado *::before, #jmv-obrigado *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

#jmv-obrigado {
  --verde:     #0C2C28;
  --terracota: #9A4B2A;
  --ambar:     #D48D4A;
  --creme:     #F1E4D3;
  --branco:    #FFFFFF;
  font-family: 'Raleway', sans-serif;
  background: var(--verde);
  color: var(--branco);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 24px;
}

#jmv-obrigado .obg-logo {
  width: 140px;
  display: block;
  margin: 0 auto 40px;
  filter: brightness(0) invert(1);
}

#jmv-obrigado .obg-check {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--ambar);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 32px;
}
#jmv-obrigado .obg-check svg { width: 36px; height: 36px; }

#jmv-obrigado .obg-title {
  font-family: 'Bethia', serif;
  font-size: clamp(32px, 6vw, 52px);
  font-weight: normal;
  color: var(--ambar);
  line-height: 1.1;
  margin-bottom: 36px;
}

#jmv-obrigado .obg-subtitle {
  font-size: 16px;
  color: rgba(255,255,255,0.8);
  max-width: 480px;
  line-height: 1.7;
  margin: 0 auto 40px;
}

#jmv-obrigado .obg-cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--ambar);
  color: #fff;
  text-decoration: none;
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 18px 36px;
  border-radius: 8px;
  margin: 0 auto 20px;
  transition: background 0.2s;
}
#jmv-obrigado .obg-cta:hover { background: #c07a3a; }
#jmv-obrigado .obg-cta svg { width: 20px; height: 20px; fill: white; flex-shrink: 0; }

#jmv-obrigado .obg-secondary {
  display: inline-block;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--branco);
  border: 1.5px solid rgba(255,255,255,0.35);
  border-radius: 8px;
  padding: 14px 28px;
  margin: 0 auto 28px;
  transition: border-color 0.2s, color 0.2s;
}
#jmv-obrigado .obg-secondary:hover { border-color: var(--ambar); color: var(--ambar); }

#jmv-obrigado .obg-back {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  text-decoration: none;
  margin-top: 8px;
  display: inline-block;
}
#jmv-obrigado .obg-back:hover { color: rgba(255,255,255,0.7); }
</style>
